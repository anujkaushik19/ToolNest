# BizNest server-side conversion lane.
# gateway  -> public HTTP API the frontend calls
# gotenberg -> headless LibreOffice conversion engine (internal only)
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # internal only — never exposed to the public; only the gateway talks to it
    expose:
      - "3000"
    command:
      - "gotenberg"
      - "--api-timeout=120s"

  # PDF -> editable Word (.docx) via pdf2docx (Python). Internal only.
  pdf-worker:
    build: ./pdf-worker
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      MAX_FILE_MB: "50"

  # Compress (ghostscript) + protect/unlock (qpdf). Internal only.
  pdf-tools:
    build: ./pdf-tools-worker
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      MAX_FILE_MB: "100"

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GOTENBERG_URL: "http://gotenberg:3000"
      PDF_WORKER_URL: "http://pdf-worker:8000"
      PDF_TOOLS_URL: "http://pdf-tools:8000"
      # comma-separated list of allowed frontend origins
      CORS_ORIGIN: "http://localhost:3000"
      MAX_FILE_MB: "100"
    depends_on:
      - gotenberg
      - pdf-worker
      - pdf-tools
